version: "3.8"

services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile.rails
    ports:
      - "3000:3000"
    volumes:
      - ./backend:/app
    environment:
      - RAILS_ENV=development
    depends_on:
      - db

  frontend:
    build: ./frontend
    ports:
      - "5173:5173"
    volumes:
      - ./frontend:/app
      - frontend_node_modules:/app/node_modules
    environment:
      - NODE_ENV=development

  db:
    image: postgres:15
    ports:
      - "5432:5432"
    environment:
      POSTGRES_PASSWORD: password
      POSTGRES_USER: postgres
      POSTGRES_DB: app_development

volumes:
  frontend_node_modules:
